name: Build & Release

on:
  push:
    tags:
      - 'v*'
  repository_dispatch:
    types: [release]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag（如 v0.4.1）'
        required: false

env:
  MAIN_REPO: Coprexist/AIsChat

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: AIsChat-Windows
            platform: windows
          - os: macos-latest
            artifact_name: AIsChat-macOS
            platform: macos
          - os: ubuntu-latest
            artifact_name: AIsChat-Linux
            platform: linux

    steps:
      - name: Checkout packaging repo
        uses: actions/checkout@v4

      - name: Determine tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "tag=${{ github.event.client_payload.tag }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag || github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout main repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MAIN_REPO }}
          ref: ${{ steps.tag.outputs.tag }}
          path: source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r source/backend/requirements.txt
          pip install customtkinter pystray pyinstaller

      - name: Build frontend
        shell: bash
        working-directory: source/frontend
        run: |
          npm ci
          npm run build

      - name: Package (Linux/macOS)
        if: matrix.platform != 'windows'
        run: |
          pyinstaller --onefile --windowed \
            --name AIsChat \
            --add-data "source/backend:backend" \
            --add-data "source/frontend/dist:frontend/dist" \
            --add-data "source/frontend/public:frontend/public" \
            --add-data "gui_app:gui_app" \
            --hidden-import gui_app \
            --hidden-import customtkinter \
            --hidden-import uvicorn.logging \
            --hidden-import uvicorn.loops \
            --hidden-import uvicorn.loops.auto \
            --hidden-import uvicorn.protocols \
            --hidden-import uvicorn.protocols.http \
            --hidden-import uvicorn.protocols.http.auto \
            --hidden-import uvicorn.protocols.websockets \
            --hidden-import uvicorn.protocols.websockets.auto \
            --hidden-import uvicorn.lifespan \
            --hidden-import uvicorn.lifespan.on \
            run_packaged.py

      - name: Package (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          pyinstaller --onefile --windowed `
            --name AIsChat `
            --add-data "source/backend;backend" `
            --add-data "source/frontend/dist;frontend/dist" `
            --add-data "source/frontend/public;frontend/public" `
            --add-data "gui_app;gui_app" `
            --hidden-import gui_app `
            --hidden-import customtkinter `
            --hidden-import uvicorn.logging `
            --hidden-import uvicorn.loops `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.protocols `
            --hidden-import uvicorn.protocols.http `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.websockets `
            --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.lifespan `
            --hidden-import uvicorn.lifespan.on `
            run_packaged.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Determine tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "tag=${{ github.event.client_payload.tag }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag || github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.tag.outputs.tag }}
          name: AIsChat ${{ steps.tag.outputs.tag }}
          draft: false
          generate_release_notes: true
          files: |
            artifacts/AIsChat-Windows/*
            artifacts/AIsChat-macOS/*
            artifacts/AIsChat-Linux/*
