name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: '主仓库分支或 tag'
        required: false
        default: 'main'

env:
  MAIN_REPO: Coprexist/AIsChat

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: AIsChat-Windows
            platform: windows
          - os: macos-latest
            artifact_name: AIsChat-macOS
            platform: macos
          - os: ubuntu-latest
            artifact_name: AIsChat-Linux
            platform: linux

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout main repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MAIN_REPO }}
          ref: ${{ inputs.ref || github.ref_name || 'main' }}
          path: source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r source/backend/requirements.txt
          pip install customtkinter pystray pyinstaller

      - name: Build frontend
        working-directory: source/frontend
        run: |
          npm ci
          npm run build

      - name: Package (Linux/macOS)
        if: matrix.platform != 'windows'
        run: |
          pyinstaller --onefile --windowed \
            --name AIsChat \
            --add-data "source/backend:backend" \
            --add-data "source/frontend/dist:frontend/dist" \
            --add-data "source/frontend/public:frontend/public" \
            --add-data "gui_app:gui_app" \
            --hidden-import gui_app \
            --hidden-import customtkinter \
            --hidden-import uvicorn.logging \
            --hidden-import uvicorn.loops \
            --hidden-import uvicorn.loops.auto \
            --hidden-import uvicorn.protocols \
            --hidden-import uvicorn.protocols.http \
            --hidden-import uvicorn.protocols.http.auto \
            --hidden-import uvicorn.protocols.websockets \
            --hidden-import uvicorn.protocols.websockets.auto \
            --hidden-import uvicorn.lifespan \
            --hidden-import uvicorn.lifespan.on \
            run_packaged.py

      - name: Package (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          pyinstaller --onefile --windowed `
            --name AIsChat `
            --add-data "source/backend;backend" `
            --add-data "source/frontend/dist;frontend/dist" `
            --add-data "source/frontend/public;frontend/public" `
            --add-data "gui_app;gui_app" `
            --hidden-import gui_app `
            --hidden-import customtkinter `
            --hidden-import uvicorn.logging `
            --hidden-import uvicorn.loops `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.protocols `
            --hidden-import uvicorn.protocols.http `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.websockets `
            --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.lifespan `
            --hidden-import uvicorn.lifespan.on `
            run_packaged.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.MAIN_REPO }}
          tag_name: ${{ github.ref_name }}
          name: AIsChat ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            artifacts/AIsChat-Windows/*
            artifacts/AIsChat-macOS/*
            artifacts/AIsChat-Linux/*
